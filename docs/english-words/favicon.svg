<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Book shape -->
  <rect x="10" y="12" width="44" height="46" rx="6" fill="#fff"/>
  <rect x="10" y="12" width="44" height="12" rx="6" fill="#E91E63"/>
  <rect x="10" y="18" width="44" height="6" fill="#E91E63"/>

  <!-- Center line (book spine) -->
  <line x1="32" y1="24" x2="32" y2="58" stroke="#E0E0E0" stroke-width="2"/>

  <!-- Text lines to represent words -->
  <line x1="16" y1="32" x2="28" y2="32" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="32" x2="48" y2="32" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="40" x2="28" y2="40" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="40" x2="48" y2="40" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="48" x2="28" y2="48" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="48" x2="48" y2="48" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>
